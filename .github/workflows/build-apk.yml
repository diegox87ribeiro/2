name: Gerar APK Debug (INVEST AI)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-debug-apk:
    name: Compilar app-debug.apk
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restaurar ou gerar debug.keystore do projeto
        run: |
          if [ ! -s debug.keystore ] && [ -s debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -s debug.keystore ]; then
            echo "AVISO: debug.keystore.base64 ausente; gerando keystore temporária (cadastre o SHA-1 abaixo no Firebase para o login Google funcionar)."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -E "SHA1:|SHA256:" || true

      - name: Gerar APK de Debug
        run: gradle :app:assembleDebug --no-daemon

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: invest-ai-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
