name: Gerar APK Debug (INVEST AI)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Compilar app-debug.apk
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes Android necessários
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Restaurar ou gerar debug.keystore
        shell: bash
        run: |
          if [ ! -s debug.keystore ] && [ -s debug.keystore.base64 ]; then
            base64 --decode debug.keystore.base64 > debug.keystore
          fi

          if [ ! -s debug.keystore ]; then
            echo "Gerando keystore temporária..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          keytool -list -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -storepass android \
            -keypass android |
            grep -E "SHA1:|SHA256:" || true

      - name: Gerar APK de Debug
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: invest-ai-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
