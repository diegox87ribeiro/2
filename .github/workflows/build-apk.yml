name: Gerar APK Debug (INVEST AI)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Compilar app-debug.apk
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # O runner ubuntu-latest já inclui o Android SDK.
      - name: Instalar componentes Android necessários
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager não encontrado em $ANDROID_HOME/cmdline-tools" >&2
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
          cache-read-only: false

      - name: Restaurar ou gerar debug.keystore
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s debug.keystore ] && [ -s debug.keystore.base64 ]; then
            base64 --decode debug.keystore.base64 > debug.keystore
          fi

          if [ ! -s debug.keystore ]; then
            echo "Gerando keystore temporária..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          keytool -list -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -storepass android \
            -keypass android |
            grep -E "SHA1:|SHA256:" || true

      - name: Restaurar configuração Firebase (se disponível nos Secrets)
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [ ! -s app/google-services.json ]; then
            if [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
              printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
              echo "OK: app/google-services.json restaurado via secret GOOGLE_SERVICES_JSON."
            elif [ -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
              printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
              echo "OK: app/google-services.json restaurado via secret GOOGLE_SERVICES_JSON_BASE64."
            fi
          fi

      - name: Verificar configuração Firebase e gerar APK de Debug
        shell: bash
        run: |
          set -euo pipefail
          if [ -s app/google-services.json ]; then
            echo "OK: app/google-services.json encontrado para compilação."
          else
            echo "AVISO: app/google-services.json ausente; defina o secret GOOGLE_SERVICES_JSON no GitHub Actions para ativar Login Google, Firestore e Gemini."
          fi
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: invest-ai-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
