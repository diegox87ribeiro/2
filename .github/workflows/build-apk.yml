name: Gerar APK Debug (INVEST AI)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Compilar app-debug.apk
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # O runner ubuntu-latest já inclui o Android SDK.
      - name: Instalar componentes Android necessários
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager não encontrado em $ANDROID_HOME/cmdline-tools" >&2
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
          cache-read-only: false

      - name: Restaurar ou gerar debug.keystore
        shell: bash
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          KEYSTORE_SOURCE="repo-debug.keystore"
          if [ ! -s debug.keystore ] && [ -s debug.keystore.base64 ]; then
            base64 --decode debug.keystore.base64 > debug.keystore
            KEYSTORE_SOURCE="debug.keystore.base64"
          elif [ ! -s debug.keystore ] && [ -n "${DEBUG_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > debug.keystore
            KEYSTORE_SOURCE="secret:DEBUG_KEYSTORE_BASE64"
          fi

          if [ ! -s debug.keystore ]; then
            KEYSTORE_SOURCE="temporaria-aleatoria"
            echo "AVISO: debug.keystore.base64 e secret DEBUG_KEYSTORE_BASE64 ausentes. Gerando keystore temporária..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          KEYTOOL_INFO="$(keytool -list -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -storepass android \
            -keypass android || true)"
          echo "$KEYTOOL_INFO" | grep -E "SHA1:|SHA256:" || true
          SHA1_COLON="$(echo "$KEYTOOL_INFO" | sed -n 's/.*SHA1:[[:space:]]*\([0-9A-Fa-f:]*\).*/\1/p' | head -n1)"
          SHA1_HEX="$(echo "$SHA1_COLON" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          {
            echo "APK_SHA1_COLON=$SHA1_COLON"
            echo "APK_SHA1_HEX=$SHA1_HEX"
            echo "KEYSTORE_SOURCE=$KEYSTORE_SOURCE"
          } >> "$GITHUB_ENV"

      - name: Restaurar configuração Firebase (se disponível nos Secrets)
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [ ! -s app/google-services.json ]; then
            if [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
              printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
              echo "OK: app/google-services.json restaurado via secret GOOGLE_SERVICES_JSON."
            elif [ -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
              printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
              echo "OK: app/google-services.json restaurado via secret GOOGLE_SERVICES_JSON_BASE64."
            fi
          fi

      - name: Verificar configuração Firebase e gerar APK de Debug
        shell: bash
        run: |
          set -euo pipefail
          if [ -s app/google-services.json ]; then
            echo "OK: app/google-services.json encontrado para compilação."
            python3 -c '
            import textwrap
            exec(textwrap.dedent("""
            import json, os

            sha1_hex = os.environ.get("APK_SHA1_HEX", "").lower()
            sha1_colon = os.environ.get("APK_SHA1_COLON", "")
            keystore_src = os.environ.get("KEYSTORE_SOURCE", "")
            with open("app/google-services.json", "r", encoding="utf-8") as f:
                data = json.load(f)

            hashes = []
            for client in data.get("client", []):
                for oc in client.get("oauth_client", []):
                    ch = oc.get("android_info", {}).get("certificate_hash")
                    if ch:
                        hashes.append(ch.lower())

            matched = sha1_hex in hashes if hashes else False
            print(f"Keystore source: {keystore_src}")
            print(f"APK SHA-1: {sha1_colon}")
            print(f"Firebase certificate_hashes: {hashes}")
            if hashes and not matched:
                print("::warning::SHA-1 do APK nao corresponde ao certificate_hash do google-services.json! Login Google sera recusado ate cadastrar este SHA-1 no Firebase ou configurar o secret DEBUG_KEYSTORE_BASE64.")

            summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
            if summary_path:
                expected_hashes = ", ".join(hashes)
                with open(summary_path, "a", encoding="utf-8") as s:
                    s.write("### Diagnostico de Assinatura e Firebase\\n")
                    s.write(f"- **Origem da Keystore:** `{keystore_src}`\\n")
                    s.write(f"- **SHA-1 do APK:** `{sha1_colon}`\\n")
                    if hashes:
                        s.write(f"- **SHA-1 esperado no google-services.json:** `{expected_hashes}`\\n")
                    if matched:
                        s.write("- **Status Login Google:** Compativel (SHA-1 corresponde ao google-services.json)\\n")
                    else:
                        s.write("- **Status Login Google:** INCOMPATIVEL — adicione este SHA-1 no Firebase Console (e atualize `GOOGLE_SERVICES_JSON`) OU configure o secret `DEBUG_KEYSTORE_BASE64`.\\n")
            """))'
          else
            echo "AVISO: app/google-services.json ausente; defina o secret GOOGLE_SERVICES_JSON no GitHub Actions para ativar Login Google, Firestore e Gemini."
          fi
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: invest-ai-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
